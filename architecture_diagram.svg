<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="900" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- data/ -->
  <rect x="310" y="20" width="200" height="55" rx="6" fill="#eef2f7" stroke="#333333"/>
  <text x="410" y="42" text-anchor="middle" font-size="14" font-weight="bold">data/</text>
  <text x="410" y="60" text-anchor="middle" font-size="11">.txt  .pdf  .docx (6 sample files)</text>

  <line x1="410" y1="75" x2="410" y2="105" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ingest.py -->
  <rect x="280" y="105" width="260" height="55" rx="6" fill="#eef2f7" stroke="#333333"/>
  <text x="410" y="127" text-anchor="middle" font-size="14" font-weight="bold">ingest.py</text>
  <text x="410" y="145" text-anchor="middle" font-size="11">text extraction + per-file error handling</text>

  <line x1="410" y1="160" x2="410" y2="190" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- extract.py + side deps -->
  <rect x="270" y="190" width="280" height="60" rx="6" fill="#e4edf9" stroke="#333333"/>
  <text x="410" y="213" text-anchor="middle" font-size="14" font-weight="bold">extract.py</text>
  <text x="410" y="231" text-anchor="middle" font-size="11">LLM + CaseRecord (Pydantic) structured output</text>

  <!-- llm_provider.py box, feeding into extract/email/summary -->
  <rect x="20" y="330" width="170" height="55" rx="6" fill="#f7f2e8" stroke="#333333"/>
  <text x="105" y="352" text-anchor="middle" font-size="13" font-weight="bold">llm_provider.py</text>
  <text x="105" y="369" text-anchor="middle" font-size="10">provider factory (config.json)</text>

  <!-- schemas.py box -->
  <rect x="630" y="190" width="170" height="55" rx="6" fill="#f7f2e8" stroke="#333333"/>
  <text x="715" y="212" text-anchor="middle" font-size="13" font-weight="bold">schemas.py</text>
  <text x="715" y="229" text-anchor="middle" font-size="10">CaseRecord (10 fields)</text>

  <line x1="630" y1="217" x2="550" y2="217" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="190" y1="357" x2="270" y2="230" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="410" y1="250" x2="410" y2="280" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch label -->
  <text x="410" y="275" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">CaseRecord</text>

  <!-- split into two -->
  <line x1="410" y1="280" x2="200" y2="330" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="280" x2="620" y2="330" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- generate_email.py -->
  <rect x="40" y="415" width="260" height="60" rx="6" fill="#eaf6ec" stroke="#333333"/>
  <text x="170" y="438" text-anchor="middle" font-size="14" font-weight="bold">generate_email.py</text>
  <text x="170" y="456" text-anchor="middle" font-size="11">customer response email (grounded, no invented info)</text>

  <!-- generate_summary.py -->
  <rect x="520" y="415" width="260" height="60" rx="6" fill="#eaf6ec" stroke="#333333"/>
  <text x="650" y="438" text-anchor="middle" font-size="14" font-weight="bold">generate_summary.py</text>
  <text x="650" y="456" text-anchor="middle" font-size="11">internal case summary (overview, status, next action)</text>

  <line x1="200" y1="385" x2="170" y2="415" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="385" x2="650" y2="415" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="170" y1="475" x2="380" y2="520" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="475" x2="440" y2="520" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- workflow.py -->
  <rect x="270" y="520" width="280" height="60" rx="6" fill="#e4edf9" stroke="#333333"/>
  <text x="410" y="543" text-anchor="middle" font-size="14" font-weight="bold">workflow.py</text>
  <text x="410" y="561" text-anchor="middle" font-size="11">orchestrates one document, saves outputs, logs result</text>

  <line x1="410" y1="580" x2="410" y2="610" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output folders -->
  <rect x="80" y="610" width="200" height="60" rx="6" fill="#f5eef2" stroke="#333333"/>
  <text x="180" y="633" text-anchor="middle" font-size="12" font-weight="bold">output/structured_data/</text>
  <text x="180" y="650" text-anchor="middle" font-size="10">&lt;doc_id&gt;.json</text>

  <rect x="310" y="610" width="200" height="60" rx="6" fill="#f5eef2" stroke="#333333"/>
  <text x="410" y="633" text-anchor="middle" font-size="12" font-weight="bold">output/customer_emails/</text>
  <text x="410" y="650" text-anchor="middle" font-size="10">&lt;doc_id&gt;.txt</text>

  <rect x="540" y="610" width="200" height="60" rx="6" fill="#f5eef2" stroke="#333333"/>
  <text x="640" y="633" text-anchor="middle" font-size="12" font-weight="bold">output/case_summaries/</text>
  <text x="640" y="650" text-anchor="middle" font-size="10">&lt;doc_id&gt;.txt</text>

  <line x1="180" y1="670" x2="180" y2="700" stroke="#888888" stroke-width="1.2"/>
  <line x1="410" y1="670" x2="410" y2="700" stroke="#888888" stroke-width="1.2"/>
  <line x1="640" y1="670" x2="640" y2="700" stroke="#888888" stroke-width="1.2"/>
  <line x1="180" y1="700" x2="640" y2="700" stroke="#888888" stroke-width="1.2"/>
  <line x1="410" y1="700" x2="410" y2="730" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- main.py -->
  <rect x="260" y="730" width="300" height="65" rx="6" fill="#fdeeee" stroke="#333333"/>
  <text x="410" y="753" text-anchor="middle" font-size="14" font-weight="bold">main.py</text>
  <text x="410" y="771" text-anchor="middle" font-size="11">batch entrypoint: loops all of data/,</text>
  <text x="410" y="786" text-anchor="middle" font-size="11">calls workflow.process_document() per file</text>

  <line x1="410" y1="795" x2="410" y2="825" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final report -->
  <rect x="290" y="825" width="240" height="55" rx="6" fill="#fdeeee" stroke="#333333"/>
  <text x="410" y="848" text-anchor="middle" font-size="14" font-weight="bold">output/final_report.csv</text>
  <text x="410" y="866" text-anchor="middle" font-size="11">consolidated view, all documents</text>

</svg>
