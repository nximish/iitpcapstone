<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="920" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999999"/>
    </marker>
  </defs>

  <!-- data/ -->
  <rect x="300" y="20" width="300" height="80" rx="6" fill="#eef2f7" stroke="#333333"/>
  <text x="450" y="44" text-anchor="middle" font-size="14" font-weight="bold">data/</text>
  <text x="450" y="62" text-anchor="middle" font-size="11">.txt   .pdf   .docx</text>
  <text x="450" y="78" text-anchor="middle" font-size="11">6 valid samples + 1 corrupted (test)</text>

  <line x1="450" y1="100" x2="450" y2="130" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ingest.py -->
  <rect x="290" y="130" width="320" height="65" rx="6" fill="#eef2f7" stroke="#333333"/>
  <text x="450" y="155" text-anchor="middle" font-size="14" font-weight="bold">ingest.py</text>
  <text x="450" y="173" text-anchor="middle" font-size="11">extracts text per file, skips ones that fail</text>

  <line x1="450" y1="195" x2="450" y2="225" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- extract.py -->
  <rect x="280" y="225" width="340" height="78" rx="6" fill="#e4edf9" stroke="#333333"/>
  <text x="450" y="250" text-anchor="middle" font-size="14" font-weight="bold">extract.py</text>
  <text x="450" y="268" text-anchor="middle" font-size="11">LLM call -&gt; structured CaseRecord</text>
  <text x="450" y="284" text-anchor="middle" font-size="11">(retry + backoff via utils.py)</text>

  <!-- side: llm_provider.py -->
  <rect x="20" y="228" width="230" height="32" rx="5" fill="#f7f2e8" stroke="#888888" stroke-dasharray="4,3"/>
  <text x="135" y="248" text-anchor="middle" font-size="12" font-weight="bold">llm_provider.py</text>
  <line x1="250" y1="244" x2="280" y2="244" stroke="#999999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>

  <!-- side: utils.py -->
  <rect x="20" y="268" width="230" height="32" rx="5" fill="#f7f2e8" stroke="#888888" stroke-dasharray="4,3"/>
  <text x="135" y="288" text-anchor="middle" font-size="12" font-weight="bold">utils.py</text>
  <line x1="250" y1="284" x2="280" y2="284" stroke="#999999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>

  <!-- side: schemas.py -->
  <rect x="650" y="232" width="230" height="62" rx="5" fill="#f7f2e8" stroke="#888888" stroke-dasharray="4,3"/>
  <text x="765" y="256" text-anchor="middle" font-size="13" font-weight="bold">schemas.py</text>
  <text x="765" y="274" text-anchor="middle" font-size="10">CaseRecord schema (fixed sets)</text>
  <line x1="650" y1="263" x2="620" y2="263" stroke="#999999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>

  <!-- branch stem -->
  <line x1="450" y1="303" x2="450" y2="330" stroke="#444444" stroke-width="1.5"/>
  <text x="465" y="322" font-size="11" font-style="italic" fill="#555555">CaseRecord</text>

  <!-- branch bar -->
  <line x1="190" y1="330" x2="710" y2="330" stroke="#444444" stroke-width="1.5"/>
  <line x1="190" y1="330" x2="190" y2="375" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="330" x2="710" y2="375" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- generate_email.py -->
  <rect x="60" y="375" width="260" height="65" rx="6" fill="#eaf6ec" stroke="#333333"/>
  <text x="190" y="400" text-anchor="middle" font-size="14" font-weight="bold">generate_email.py</text>
  <text x="190" y="418" text-anchor="middle" font-size="11">customer email (grounded to CaseRecord)</text>

  <!-- generate_summary.py -->
  <rect x="580" y="375" width="260" height="65" rx="6" fill="#eaf6ec" stroke="#333333"/>
  <text x="710" y="400" text-anchor="middle" font-size="14" font-weight="bold">generate_summary.py</text>
  <text x="710" y="418" text-anchor="middle" font-size="11">internal summary (category, escalation)</text>

  <!-- merge bar -->
  <line x1="190" y1="440" x2="190" y2="465" stroke="#444444" stroke-width="1.5"/>
  <line x1="710" y1="440" x2="710" y2="465" stroke="#444444" stroke-width="1.5"/>
  <line x1="190" y1="465" x2="710" y2="465" stroke="#444444" stroke-width="1.5"/>
  <line x1="450" y1="465" x2="450" y2="495" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- workflow.py -->
  <rect x="300" y="495" width="300" height="75" rx="6" fill="#e4edf9" stroke="#333333"/>
  <text x="450" y="520" text-anchor="middle" font-size="14" font-weight="bold">workflow.py</text>
  <text x="450" y="538" text-anchor="middle" font-size="11">orchestrates one document: saves 3 files,</text>
  <text x="450" y="554" text-anchor="middle" font-size="11">catches failures, logs result</text>

  <line x1="450" y1="570" x2="450" y2="600" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output/ -->
  <rect x="270" y="600" width="360" height="100" rx="6" fill="#f5eef2" stroke="#333333"/>
  <text x="450" y="624" text-anchor="middle" font-size="14" font-weight="bold">output/</text>
  <text x="450" y="644" text-anchor="middle" font-size="11" font-family="Consolas, monospace">structured_data/&lt;doc_id&gt;.json</text>
  <text x="450" y="662" text-anchor="middle" font-size="11" font-family="Consolas, monospace">customer_emails/&lt;doc_id&gt;.txt</text>
  <text x="450" y="680" text-anchor="middle" font-size="11" font-family="Consolas, monospace">case_summaries/&lt;doc_id&gt;.txt</text>

  <line x1="450" y1="700" x2="450" y2="730" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- main.py -->
  <rect x="300" y="730" width="300" height="78" rx="6" fill="#fdeeee" stroke="#333333"/>
  <text x="450" y="756" text-anchor="middle" font-size="14" font-weight="bold">main.py</text>
  <text x="450" y="774" text-anchor="middle" font-size="11">batch entrypoint: loops data/,</text>
  <text x="450" y="790" text-anchor="middle" font-size="11">calls workflow.process_document() per file</text>

  <line x1="450" y1="808" x2="450" y2="838" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final report -->
  <rect x="300" y="838" width="300" height="62" rx="6" fill="#fdeeee" stroke="#333333"/>
  <text x="450" y="863" text-anchor="middle" font-size="14" font-weight="bold">output/final_report.csv</text>
  <text x="450" y="881" text-anchor="middle" font-size="11">consolidated view — all documents</text>

</svg>
